name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: iwp

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iwp
          POSTGRES_PASSWORD: iwp
          POSTGRES_DB: iwp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IWP_TEST_DATABASE_URL: postgresql+psycopg://iwp:iwp@localhost:5432/iwp_test
      # A missing database must fail CI, not silently skip the ledger tests.
      IWP_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      # lint, types and tests each fail the pipeline independently.
      - name: Lint
        run: make lint

      - name: Types
        run: make types

      - name: Tests
        run: make test

  ai-eval:
    # P7.2: the adversarial evaluation suite is a hard deploy gate, run separately so a
    # failure here is unambiguous. Assertions in tests/eval are frozen — see CLAUDE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv pip install -e ".[dev]"
      - name: Adversarial eval (must be 100%)
        run: uv run python -m iwp.ai.eval.runner --fail-under 100
