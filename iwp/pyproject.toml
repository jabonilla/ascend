[project]
name = "iwp"
version = "0.1.0"
description = "Cross-border outcome-based remittance platform (codename IWP)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ARG", "PTH", "TID"]
# N818 (exception names must end in Error): the PRD and build guide name domain
# exceptions without the suffix (e.g. `CapabilityUnsupported` in P3.1). Matching the
# spec's vocabulary is worth more here than the convention.
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "db: test requires a live PostgreSQL database",
    "slow: test is slow (concurrency / property sweeps)",
]
filterwarnings = ["error"]
